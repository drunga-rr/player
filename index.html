<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <meta name="content-language" content="pt-BR">
  <title>Drive Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">▶</div>
      <div><h1>Drive<span>Player</span></h1><p>Seu vídeo, em uma tela só.</p></div>
    </header>

    <section class="panel">
      <label for="driveLink">Link compartilhado do Google Drive</label>
      <div class="input-row">
        <input id="driveLink" type="url" inputmode="url" placeholder="Cole aqui o link do vídeo…" autocomplete="off">
        <button id="playBtn" type="button">▶ Reproduzir</button>
      </div>
      <p class="hint">O arquivo precisa estar compartilhado como <strong>Qualquer pessoa com o link</strong>.</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>


    <section class="player-wrap" aria-label="Reprodutor de vídeo">
      <div id="emptyState" class="empty-state">
        <div class="big-play">▶</div>
        <h2>Seu vídeo aparecerá aqui</h2>
        <p>Cole um link do Google Drive acima para começar.</p>
      </div>
      <iframe id="player" title="Vídeo do Google Drive" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
    </section>
    <div class="controls"><button id="clearBtn" type="button">Limpar vídeo</button></div>
    <footer>DrivePlayer · Reproduz vídeos compartilhados do Google Drive</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
